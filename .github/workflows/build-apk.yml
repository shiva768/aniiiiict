name: Build APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !(github.event.action == 'opened' && github.event.pull_request.user.login == 'Copilot') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GRADLE_OPTS: -Dorg.gradle.configuration-cache=false
      ANNICT_CLIENT_ID: ${{ secrets.ANNICT_CLIENT_ID }}
      ANNICT_CLIENT_SECRET: ${{ secrets.ANNICT_CLIENT_SECRET }}
      MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode debug keystore
        run: |
          mkdir -p app
          printf '%s' "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > app/debug.keystore

      - name: Get timestamp
        id: timestamp
        run: echo "value=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Build APK
        env:
          BUILD_TIMESTAMP: ${{ steps.timestamp.outputs.value }}
          BUILD_REF_NAME: ${{ github.head_ref || github.ref_name }}
        # 普段使いは release。debug は手動実行（workflow_dispatch）のときだけ作る
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ./gradlew assembleRelease assembleDebug --stacktrace
          else
            ./gradlew assembleRelease --stacktrace
          fi

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-${{ steps.timestamp.outputs.value }}.apk
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-debug-${{ steps.timestamp.outputs.value }}.apk
          fi

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ steps.timestamp.outputs.value }}
          path: app/build/outputs/apk/debug/app-debug-${{ steps.timestamp.outputs.value }}.apk
          retention-days: 7

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.timestamp.outputs.value }}
          path: app/build/outputs/apk/release/app-release-${{ steps.timestamp.outputs.value }}.apk
          retention-days: 7
